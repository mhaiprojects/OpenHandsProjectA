<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AFK AI - Build Your AI Empire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            border: 1px solid rgba(0, 255, 204, 0.3);
        }
        #game-canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #ui-overlay > * { pointer-events: auto; }
        
        /* Modal backdrop */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0;
            right: 0; bottom: 0;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(4px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }
        
        /* Modal shop */
        .modal-shop {
            background: rgba(10, 10, 26, 0.98);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(0, 255, 204, 0.1);
        }
        .modal-header h2 {
            color: #00ffcc;
            font-size: 18px;
            margin: 0;
        }
        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
    </div>

    <script type="module">
        // Load Phaser FIRST
        const PhaserModule = await import('https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.esm.js');
        const { Game: PhaserGame, Scene: PhaserScene, AUTO } = PhaserModule;
        
        // Load core modules
        const eventBusModule = await import('./js/core/EventBus.js');
        const { eventBus } = eventBusModule;
        
        const configManagerModule = await import('./js/core/ConfigManager.js');
        const { ConfigManager } = configManagerModule;
        
        const saveManagerModule = await import('./js/core/SaveManager.js');
        const { SaveManager } = saveManagerModule;
        
        const gameStateModule = await import('./js/ui/GameUI.js');
        const { GameState } = gameStateModule;
        
        // Main Phaser Scene
        class MainGame extends PhaserScene {
            constructor() {
                super({ key: 'MainGame' });
                this.mainSprite = null;
            }
            
            create() {
                // Create background grid
                const graphics = this.add.graphics();
                graphics.lineStyle(1, 0x00ffcc, 0.05);
                for (let x = 0; x < 800; x += 40) {
                    graphics.moveTo(x, 0);
                    graphics.lineTo(x, 600);
                }
                for (let y = 0; y < 600; y += 40) {
                    graphics.moveTo(0, y);
                    graphics.lineTo(800, y);
                }
                graphics.strokePath();
                
                // Floating particles (subtle)
                for (let i = 0; i < 8; i++) {
                    const x = Phaser.Math.Between(50, 750);
                    const y = Phaser.Math.Between(50, 550);
                    const size = Phaser.Math.Between(2, 5);
                    const particle = this.add.circle(x, y, size, 0x00ffcc, 0.2);
                    this.tweens.add({
                        targets: particle,
                        y: `+=${Phaser.Math.Between(-20, 20)}`,
                        alpha: 0.1,
                        duration: Phaser.Math.Between(2000, 4000),
                        ease: 'Sine.easeInOut',
                        yoyo: true,
                        repeat: -1
                    });
                }
                
                // Main clickable orb
                this.mainSprite = this.add.circle(400, 300, 40, 0x00ffcc);
                this.mainSprite.setInteractive({ useHandCursor: true });
                
                // Glow effect
                const glow = this.add.circle(400, 300, 55, 0x00ffcc, 0.15);
                glow.setBlendMode(Phaser.BlendModes.ADD);
                
                this.tweens.add({
                    targets: glow,
                    scaleX: 1.2, scaleY: 1.2, alpha: 0.08,
                    duration: 1500, ease: 'Sine.easeInOut', yoyo: true, repeat: -1
                });
                
                // Click handler
                this.mainSprite.on('pointerdown', () => {
                    this.showClickFeedback();
                    eventBus.emit('main_game:click', { x: 400, y: 300 });
                });
                
                // Hover effects
                this.mainSprite.on('pointerover', () => {
                    this.tweens.add({ targets: [this.mainSprite, glow], scaleX: 1.1, scaleY: 1.1, duration: 100 });
                });
                this.mainSprite.on('pointerout', () => {
                    this.tweens.add({ targets: [this.mainSprite, glow], scaleX: 1, scaleY: 1, duration: 100 });
                });
                
                // Idle float animation
                this.tweens.add({
                    targets: [this.mainSprite, glow],
                    y: '+=8', duration: 2500, ease: 'Sine.easeInOut', yoyo: true, repeat: -1
                });
                
                // Listen for purchase events (subtle shake)
                eventBus.on('upgrade:purchased', () => {
                    this.cameras.main.shake(100, 0.003);
                });
            }
            
            showClickFeedback(x = 400, y = 300) {
                // Subtle ring effect
                const ring = this.add.circle(x, y, 20, 0x00ffcc, 0.5);
                this.tweens.add({
                    targets: ring,
                    scaleX: 3, scaleY: 3, alpha: 0, duration: 300,
                    onComplete: () => ring.destroy()
                });
                
                // Small particles
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    const particle = this.add.circle(x, y, 2, 0x00ffcc, 0.6);
                    this.tweens.add({
                        targets: particle,
                        x: x + Math.cos(angle) * 40,
                        y: y + Math.sin(angle) * 40,
                        alpha: 0, duration: 250,
                        onComplete: () => particle.destroy()
                    });
                }
                
                // Subtle floating text
                const text = this.add.text(x, y - 25, '+Crypto', {
                    fontSize: '14px', fontFamily: 'monospace', color: '#00ffcc',
                    stroke: '#003333', strokeThickness: 2
                });
                text.setOrigin(0.5);
                this.tweens.add({
                    targets: text,
                    y: y - 40, alpha: 0, duration: 500,
                    onComplete: () => text.destroy()
                });
            }
        }
        
        // Initialize game state
        const configManager = new ConfigManager();
        await configManager.loadAll();
        
        const saveManager = new SaveManager();
        const gameState = new GameState(configManager, saveManager);
        
        // Restore saved state
        const savedState = saveManager.load();
        if (savedState) {
            gameState.restoreState(savedState);
        }
        
        // Create Phaser game
        const gameConfig = configManager.get('game');
        const phaserGame = new PhaserGame({
            type: AUTO,
            width: gameConfig.resolution?.width || 800,
            height: gameConfig.resolution?.height || 600,
            parent: 'game-container',
            backgroundColor: gameConfig.backgroundColor || '#050510',
            scene: [MainGame]
        });
        
        // Create Vue app for UI
        const uiContainer = document.getElementById('ui-overlay');
        
        const vueModule = await import('https://unpkg.com/vue@3/dist/vue.esm-browser.js');
        const { createApp } = vueModule;
        
        const app = createApp({
            data() {
                return {
                    resources: {},
                    upgrades: {},
                    stats: { totalClicks: 0, totalTimePlayed: 0 },
                    rates: { crypto: 0, hash: 0, data: 0, token: 0 },
                    shopOpen: false,
                    notification: null
                };
            },
            computed: {
                filteredUpgrades() {
                    return Object.values(this.upgrades).filter(u => u.unlocked);
                },
                totalUpgradesOwned() {
                    return Object.values(this.upgrades).reduce((sum, u) => sum + u.owned, 0);
                }
            },
            methods: {
                formatNumber(num) {
                    if (!num || isNaN(num)) return '0';
                    if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
                    if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
                    if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
                    if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
                    return Math.floor(num).toString();
                },
                formatTime(seconds) {
                    const hrs = Math.floor(seconds / 3600);
                    const mins = Math.floor((seconds % 3600) / 60);
                    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                },
                openShop() {
                    this.shopOpen = true;
                },
                closeShop() {
                    this.shopOpen = false;
                },
                purchaseUpgrade(upgradeId) {
                    const success = gameState.purchaseUpgrade(upgradeId);
                    if (success) {
                        this.showNotification('Purchased!');
                    }
                },
                showNotification(msg) {
                    this.notification = msg;
                    setTimeout(() => { this.notification = null; }, 2000);
                },
                saveGame() {
                    gameState.save();
                    this.showNotification('Game saved!');
                },
                resetGame() {
                    if (confirm('Reset all progress?')) {
                        gameState.reset();
                    }
                }
            },
            mounted() {
                // Subscribe to state updates
                eventBus.on('game:state_update', (data) => {
                    this.resources = data.resources;
                    this.upgrades = data.upgrades;
                    this.stats = data.stats;
                    this.rates = data.rates;
                });
                
                eventBus.on('game:offline_progress', () => {
                    this.showNotification('Welcome back!');
                });
                
                // Connect Phaser clicks to game state
                eventBus.on('main_game:click', () => {
                    gameState.handleClick(400, 300);
                });
                
                // Start game loop
                gameState.start();
                
                // Auto-save every 30 seconds
                setInterval(() => gameState.save(), 30000);
            },
            template: `
                <div class="game-ui">
                    <!-- Game Title -->
                    <div class="game-title">
                        <span class="title-text">MY AFK AI</span>
                        <span class="tagline">Build your AI empire</span>
                    </div>
                    
                    <!-- Compact HUD -->
                    <div class="hud">
                        <div class="resources-panel">
                            <div v-for="(res, id) in resources" :key="id" class="resource-item">
                                <span class="resource-icon" :style="{ color: res.color }">
                                    {{ id === 'crypto' ? '₿' : id === 'hash' ? '#' : id === 'data' ? '◈' : '◇' }}
                                </span>
                                <span class="resource-value">{{ formatNumber(res.amount) }}</span>
                            </div>
                        </div>
                        <div class="stats-panel">
                            <span>⚡ {{ formatNumber(stats.totalClicks) }}</span>
                            <span>⏱ {{ formatTime(stats.totalTimePlayed) }}</span>
                        </div>
                    </div>
                    
                    <!-- Shop button (floating) -->
                    <button class="shop-btn" @click="openShop">🛒 SHOP</button>
                    
                    <!-- Stats toggle -->
                    <button class="stats-toggle" @click="openShop">📊</button>
                    
                    <!-- Modal backdrop + shop -->
                    <div class="modal-backdrop" :class="{ open: shopOpen }" @click.self="closeShop">
                        <div class="modal-shop">
                            <div class="modal-header">
                                <h2>⚙ AI Upgrades</h2>
                                <button class="close-btn" @click="closeShop">✕</button>
                            </div>
                            <div class="modal-content">
                                <div class="upgrades-grid">
                                    <div v-for="u in filteredUpgrades" :key="u.id" class="upgrade-card">
                                        <div class="upgrade-icon">📦</div>
                                        <div class="upgrade-info">
                                            <h3>{{ u.name }}</h3>
                                            <p>{{ u.description }}</p>
                                            <span class="upgrade-rate">{{ formatNumber(u.produces?.crypto || 0) }}/s</span>
                                        </div>
                                        <div class="upgrade-meta">
                                            <span class="owned">{{ u.owned }}/{{ u.maxOwned }}</span>
                                        </div>
                                        <button class="buy-btn" 
                                                :disabled="!u.canAfford || u.maxOwnedReached"
                                                @click="purchaseUpgrade(u.id)">
                                            {{ u.maxOwnedReached ? 'MAX' : formatNumber(u.currentCost || 0) + ' ₿' }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Notification -->
                    <div v-if="notification" class="notification">{{ notification }}</div>
                </div>
            `
        });
        
        app.mount(uiContainer);
    </script>
    
    <style>
        .game-ui { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; height: 100%; position: relative; }
        
        .game-title { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 5; }
        .game-title .title-text { font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 20px rgba(0,255,204,0.5); }
        .game-title .tagline { display: block; font-size: 10px; color: #9d4edd; margin-top: 2px; }
        
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; z-index: 5; }
        .resources-panel { display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(0,255,204,0.2); flex-wrap: wrap; }
        .stats-panel { display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(0,255,204,0.2); }
        
        .resource-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .resource-icon { font-size: 12px; }
        .resource-value { font-weight: bold; color: #00ffcc; }
        
        .shop-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%);
            color: #0a0a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,255,204,0.4);
            transition: all 0.2s ease;
        }
        .shop-btn:hover { transform: translateX(-50%) scale(1.05); }
        .shop-btn:active { transform: translateX(-50%) scale(0.98); }
        
        .stats-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(0,255,204,0.2);
            color: #00ffcc;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
        
        .upgrades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        
        .upgrade-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,255,204,0.1);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .upgrade-card:hover {
            background: rgba(0,255,204,0.08);
            border-color: rgba(0,255,204,0.25);
            transform: translateY(-2px);
        }
        
        .upgrade-icon { font-size: 24px; }
        .upgrade-info { flex: 1; }
        .upgrade-info h3 { font-size: 14px; color: #00ffcc; margin: 0 0 4px 0; }
        .upgrade-info p { font-size: 11px; color: #888; margin: 0; line-height: 1.3; }
        .upgrade-rate { font-size: 11px; color: #00aa88; }
        
        .upgrade-meta { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
        
        .buy-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%);
            border: none;
            color: #0a0a1a;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .buy-btn:disabled { background: #444; color: #666; cursor: not-allowed; }
        .buy-btn:not(:disabled):active { transform: scale(0.95); }
        
        .notification { 
            position: fixed; 
            top: 80px; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 10px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            z-index: 200; 
            background: #00ffcc; 
            color: #0a0a1a;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .game-title .title-text { font-size: 16px; }
            .resources-panel { padding: 4px 8px; }
            .resource-item { font-size: 10px; }
            .upgrades-grid { grid-template-columns: 1fr; }
        }
    </style>
</body>
</html>

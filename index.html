<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AFK AI - Build Your AI Empire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: 
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(135deg, #0a0a1a 0%, #12122a 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            border: 1px solid rgba(0, 255, 204, 0.3);
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #ui-overlay > * { pointer-events: auto; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- HTML-based game visual -->
        <div id="game-visual">
            <!-- Floating particles -->
            <div class="particle p1"></div>
            <div class="particle p2"></div>
            <div class="particle p3"></div>
            <div class="particle p4"></div>
            <div class="particle p5"></div>
            <div class="particle p6"></div>
            <div class="particle p7"></div>
            <div class="particle p8"></div>
            
            <!-- Clickable orb -->
            <div class="orb-container" id="orb-container">
                <div class="orb-glow"></div>
                <div class="orb"></div>
                <div class="orb-highlight"></div>
            </div>
        </div>
        <div id="ui-overlay"></div>
    </div>

    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import { gameState } from './js/ui/GameUI.js';
        import { eventBus } from './js/core/EventBus.js';

        // Initialize game state
        await gameState.init();

        // Create Vue app for UI
        const uiContainer = document.getElementById('ui-overlay');
        
        const app = createApp({
            data() {
                return {
                    resources: {},
                    upgrades: {},
                    stats: { totalClicks: 0, totalTimePlayed: 0 },
                    rates: { crypto: 0, hash: 0, data: 0, token: 0 },
                    currentTab: 'shop',
                    panelOpen: true,
                    clickEffects: [],
                    notification: null
                };
            },
            computed: {
                filteredUpgrades() {
                    return Object.values(this.upgrades).filter(u => u.unlocked);
                },
                totalUpgradesOwned() {
                    return Object.values(this.upgrades).reduce((sum, u) => sum + u.owned, 0);
                }
            },
            methods: {
                formatNumber(num) {
                    if (!num || isNaN(num)) return '0';
                    if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
                    if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
                    if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
                    if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
                    return Math.floor(num).toString();
                },
                formatTime(seconds) {
                    const hrs = Math.floor(seconds / 3600);
                    const mins = Math.floor((seconds % 3600) / 60);
                    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                },
                switchTab(tab) {
                    this.currentTab = tab;
                    this.panelOpen = true;
                },
                closePanel() {
                    this.panelOpen = false;
                },
                handleClick(e) {
                    const orb = document.getElementById('orb-container');
                    const rect = orb.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const reward = gameState.handleClick(x, y);
                    this.addClickEffect(x, y, reward);
                    
                    // Visual feedback on orb
                    orb.classList.add('clicked');
                    setTimeout(() => orb.classList.remove('clicked'), 150);
                },
                addClickEffect(x, y, reward) {
                    const effect = {
                        id: Date.now() + Math.random(),
                        x, y,
                        text: `+${this.formatNumber(reward)}`,
                        alpha: 1,
                        offsetY: 0
                    };
                    this.clickEffects.push(effect);
                    setTimeout(() => {
                        this.clickEffects = this.clickEffects.filter(e => e.id !== effect.id);
                    }, 800);
                },
                purchaseUpgrade(upgradeId) {
                    const success = gameState.purchaseUpgrade(upgradeId);
                    if (success) {
                        this.showNotification('Purchased!');
                    }
                },
                showNotification(msg) {
                    this.notification = msg;
                    setTimeout(() => { this.notification = null; }, 2000);
                },
                saveGame() {
                    gameState.save();
                    this.showNotification('Game saved!');
                },
                resetGame() {
                    if (confirm('Reset all progress?')) {
                        gameState.reset();
                    }
                }
            },
            mounted() {
                // Subscribe to state updates
                eventBus.on('game:state_update', (data) => {
                    this.resources = data.resources;
                    this.upgrades = data.upgrades;
                    this.stats = data.stats;
                    this.rates = data.rates;
                });
                
                eventBus.on('game:offline_progress', () => {
                    this.showNotification('Welcome back!');
                });
                
                // Auto-save every 30 seconds
                setInterval(() => gameState.save(), 30000);
            },
            template: `
                <div class="game-ui">
                    <!-- Game Title -->
                    <div class="game-title">
                        <span class="title-text">MY AFK AI</span>
                        <span class="tagline">Build your AI empire</span>
                    </div>
                    
                    <!-- HUD -->
                    <div class="hud">
                        <div class="resources-panel">
                            <div v-for="(res, id) in resources" :key="id" class="resource-item">
                                <span class="resource-icon" :style="{ color: res.color }">
                                    {{ id === 'crypto' ? '₿' : id === 'hash' ? '#' : id === 'data' ? '◈' : '◇' }}
                                </span>
                                <span class="resource-value">{{ formatNumber(res.amount) }}</span>
                            </div>
                        </div>
                        <div class="stats-panel">
                            <span>⚡ {{ formatNumber(stats.totalClicks) }}</span>
                            <span>⏱ {{ formatTime(stats.totalTimePlayed) }}</span>
                        </div>
                    </div>
                    
                    <!-- Click Effects -->
                    <div v-for="effect in clickEffects" :key="effect.id" 
                         class="click-effect" 
                         :style="{ left: effect.x + 'px', top: effect.y + 'px' }">
                        {{ effect.text }}
                    </div>
                    
                    <!-- Tab Bar -->
                    <div class="tab-bar">
                        <button class="tab-btn" :class="{ active: currentTab === 'shop' }" @click="switchTab('shop')">⚙</button>
                        <button class="tab-btn" :class="{ active: currentTab === 'achievements' }" @click="switchTab('achievements')">🏆</button>
                        <button class="tab-btn" :class="{ active: currentTab === 'stats' }" @click="switchTab('stats')">📊</button>
                        <button class="tab-btn" :class="{ active: currentTab === 'settings' }" @click="switchTab('settings')">⚙️</button>
                    </div>
                    
                    <!-- Panel Container -->
                    <div class="panel-container" :class="{ open: panelOpen }">
                        <!-- SHOP Panel -->
                        <div class="panel" :class="{ active: currentTab === 'shop' }">
                            <div class="panel-header">
                                <h2>⚙ AI Upgrades</h2>
                            </div>
                            <div class="panel-content">
                                <div class="upgrades-list">
                                    <div v-for="u in filteredUpgrades" :key="u.id" class="upgrade-item">
                                        <div class="upgrade-icon">📦</div>
                                        <div class="upgrade-info">
                                            <h3>{{ u.name }}</h3>
                                            <p>{{ u.description }}</p>
                                        </div>
                                        <div class="upgrade-cost">{{ u.owned }}/{{ u.maxOwned }} owned</div>
                                        <button class="buy-btn" 
                                                :disabled="!u.canAfford || u.maxOwnedReached"
                                                @click="purchaseUpgrade(u.id)">
                                            {{ u.maxOwnedReached ? 'MAX' : formatNumber(u.currentCost || 0) + ' ₿' }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- ACHIEVEMENTS Panel -->
                        <div class="panel" :class="{ active: currentTab === 'achievements' }">
                            <div class="panel-header">
                                <h2>🏆 Achievements</h2>
                            </div>
                            <div class="panel-content">
                                <div class="placeholder-content">
                                    <p>Achievements coming soon!</p>
                                    <p class="hint">Complete milestones to unlock achievements</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- STATS Panel -->
                        <div class="panel" :class="{ active: currentTab === 'stats' }">
                            <div class="panel-header">
                                <h2>📊 Statistics</h2>
                            </div>
                            <div class="panel-content">
                                <div class="stats-list">
                                    <div class="stat-item">
                                        <span class="label">Total Clicks</span>
                                        <span class="value">{{ formatNumber(stats.totalClicks) }}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="label">Time Played</span>
                                        <span class="value">{{ formatTime(stats.totalTimePlayed) }}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="label">Total Earned</span>
                                        <span class="value">₿{{ formatNumber(resources.crypto?.totalEarned || 0) }}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="label">Upgrades Owned</span>
                                        <span class="value">{{ totalUpgradesOwned }}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="label">Crypto/sec</span>
                                        <span class="value">{{ formatNumber(rates.crypto) }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- SETTINGS Panel -->
                        <div class="panel" :class="{ active: currentTab === 'settings' }">
                            <div class="panel-header">
                                <h2>⚙️ Settings</h2>
                            </div>
                            <div class="panel-content">
                                <div class="settings-list">
                                    <button class="settings-btn" @click="saveGame">💾 Save Game</button>
                                    <button class="settings-btn" @click="resetGame">🗑️ Reset Progress</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Mobile Toggle -->
                    <button class="mobile-toggle" @click="panelOpen = !panelOpen">☰</button>
                    
                    <!-- Notification -->
                    <div v-if="notification" class="notification">{{ notification }}</div>
                </div>
            `
        });
        
        app.mount(uiContainer);
    </script>
    
    <style>
        .game-ui { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; height: 100%; position: relative; }
        
        .game-title { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 5; }
        .game-title .title-text { font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 20px rgba(0,255,204,0.5); }
        .game-title .tagline { display: block; font-size: 11px; color: #9d4edd; margin-top: 4px; }
        
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; z-index: 5; }
        .resources-panel { display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,255,204,0.2); flex-wrap: wrap; }
        .stats-panel { display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,255,204,0.2); }
        
        .resource-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
        .resource-icon { font-size: 14px; }
        .resource-value { font-weight: bold; color: #00ffcc; }
        
        /* Game Visual - HTML based */
        #game-visual {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        
        /* Floating particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
        }
        .p1 { top: 15%; left: 20%; animation-delay: 0s; }
        .p2 { top: 25%; left: 70%; animation-delay: 0.5s; }
        .p3 { top: 45%; left: 15%; animation-delay: 1s; }
        .p4 { top: 35%; left: 80%; animation-delay: 1.5s; }
        .p5 { top: 65%; left: 25%; animation-delay: 2s; }
        .p6 { top: 55%; left: 75%; animation-delay: 2.5s; }
        .p7 { top: 75%; left: 50%; animation-delay: 3s; }
        .p8 { top: 85%; left: 35%; animation-delay: 3.5s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-20px); opacity: 0.5; }
        }
        
        /* Clickable Orb */
        .orb-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            animation: orbFloat 2.5s ease-in-out infinite;
        }
        
        @keyframes orbFloat {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, calc(-50% - 8px)); }
        }
        
        .orb-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.5; }
        }
        
        .orb {
            position: relative;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
        }
        
        .orb-highlight {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        
        .orb-container:hover .orb {
            transform: scale(1.1);
        }
        
        .orb-container.clicked .orb {
            animation: clickEffect 0.15s ease-out;
        }
        
        @keyframes clickEffect {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        
        /* Click effect */
        .click-effect {
            position: absolute;
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,255,204,0.8);
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
        
        .tab-bar { position: fixed; left: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; padding: 12px 8px; background: rgba(10,10,26,0.95); border-radius: 0 16px 16px 0; border: 1px solid rgba(0,255,204,0.2); border-left: none; z-index: 20; }
        .tab-btn { width: 48px; height: 48px; border: none; background: rgba(255,255,255,0.05); color: #888; border-radius: 12px; font-size: 20px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .tab-btn:hover { background: rgba(0,255,204,0.1); color: #00ffcc; }
        .tab-btn.active { background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%); color: #0a0a1a; }
        
        .panel-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,10,26,0.95); z-index: 15; display: none; flex-direction: column; }
        .panel-container.open { display: flex; }
        
        .panel { display: none; flex-direction: column; height: 100%; }
        .panel.active { display: flex; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(0,255,204,0.1); flex-shrink: 0; }
        .panel-header h2 { font-size: 18px; margin: 0; color: #00ffcc; }
        .panel-content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        
        .upgrades-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .upgrade-item { display: flex; flex-direction: column; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 16px 12px; border-radius: 14px; border: 1px solid rgba(0,255,204,0.1); transition: all 0.2s ease; }
        .upgrade-item:hover { background: rgba(0,255,204,0.08); border-color: rgba(0,255,204,0.25); transform: translateY(-2px); }
        .upgrade-icon { font-size: 28px; }
        .upgrade-info { text-align: center; width: 100%; }
        .upgrade-info h3 { font-size: 13px; margin: 0 0 4px 0; color: #00ffcc; }
        .upgrade-info p { font-size: 10px; margin: 0; color: #777; line-height: 1.3; }
        .upgrade-cost { font-size: 10px; color: #00aa88; margin-top: 2px; }
        .buy-btn { background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%); border: none; color: #0a0a1a; padding: 10px 16px; border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 12px; width: 100%; touch-action: manipulation; }
        .buy-btn:disabled { background: #444; color: #666; cursor: not-allowed; }
        .buy-btn:not(:disabled):active { transform: scale(0.95); }
        
        .placeholder-content { text-align: center; padding: 40px 20px; color: #666; }
        .placeholder-content p { margin: 8px 0; }
        .placeholder-content .hint { font-size: 12px; color: #555; }
        
        .stats-list { display: flex; flex-direction: column; gap: 12px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stat-item .label { color: #888; font-size: 14px; }
        .stat-item .value { color: #00ffcc; font-size: 16px; font-weight: bold; }
        
        .settings-list { display: flex; flex-direction: column; gap: 12px; }
        .settings-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,204,0.2); color: #fff; padding: 16px 20px; border-radius: 12px; font-size: 14px; cursor: pointer; text-align: left; transition: all 0.2s ease; }
        .settings-btn:hover { background: rgba(0,255,204,0.1); }
        .settings-btn:active { transform: scale(0.98); }
        
        .mobile-toggle { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: linear-gradient(135deg, #00ffcc 0%, #00aa88 100%); color: #0a0a1a; border: none; border-radius: 50%; cursor: pointer; font-size: 24px; z-index: 10; box-shadow: 0 4px 20px rgba(0,255,204,0.4); touch-action: manipulation; }
        
        .notification { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border-radius: 25px; font-weight: bold; z-index: 200; background: #00ffcc; color: #0a0a1a; }
        
        @media (min-width: 768px) {
            .game-title .title-text { font-size: 28px; }
            .upgrades-list { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .tab-btn { width: 52px; height: 52px; font-size: 22px; }
        }
    </style>
</body>
</html>

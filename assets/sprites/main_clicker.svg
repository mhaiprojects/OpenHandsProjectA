<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="orbGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00ffcc"/>
      <stop offset="40%" style="stop-color:#00cc99"/>
      <stop offset="80%" style="stop-color:#009966"/>
      <stop offset="100%" style="stop-color:#006633"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="54;58;54" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Main orb -->
  <circle cx="64" cy="64" r="48" fill="url(#orbGrad)" filter="url(#glow)"/>
  <!-- Inner highlight -->
  <ellipse cx="52" cy="48" rx="20" ry="16" fill="#fff" opacity="0.3"/>
  <!-- Secondary highlight -->
  <ellipse cx="76" cy="72" rx="10" ry="8" fill="#fff" opacity="0.15"/>
  <!-- Center sparkle -->
  <polygon points="64,40 66,56 80,58 68,64 70,80 64,68 58,80 60,64 48,58 62,56" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
</svg>
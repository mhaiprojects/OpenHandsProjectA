<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="aiOrbGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00ffcc"/>
      <stop offset="40%" style="stop-color:#00aa99"/>
      <stop offset="80%" style="stop-color:#006655"/>
      <stop offset="100%" style="stop-color:#003333"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer energy rings -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="54;60;54" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="64" r="48" fill="none" stroke="#9d4edd" stroke-width="1" opacity="0.5" stroke-dasharray="8,4">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- Main AI orb -->
  <circle cx="64" cy="64" r="44" fill="url(#aiOrbGrad)" filter="url(#glow)"/>
  <!-- Circuit pattern -->
  <path d="M40,44 L50,44 L50,34 L64,34 L64,44 L74,44 L74,54 L84,54 L84,64" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <path d="M88,64 L88,74 L78,74 L78,84 L64,84 L64,74 L54,74 L54,64" fill="none" stroke="#9d4edd" stroke-width="2" opacity="0.6"/>
  <!-- Inner highlight -->
  <ellipse cx="48" cy="48" rx="16" ry="12" fill="#fff" opacity="0.3"/>
  <!-- Core symbol -->
  <text x="64" y="72" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle" fill="#00ffcc" opacity="0.8">AI</text>
</svg>